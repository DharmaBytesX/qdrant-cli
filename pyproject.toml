[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qdrant-cli"
version = "0.1.0"
description = "CLI tool to interact with Qdrant vector database"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "qdrant-client>=1.18",
    "sentence-transformers>=3.0",
    "markitdown>=0.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf2>=3.0",
]

[project.scripts]
qdrant-cli = "qdrant_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
